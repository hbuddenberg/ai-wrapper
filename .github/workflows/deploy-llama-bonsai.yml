name: Build and push llama-bonsai image

on:
  push:
    branches: [main]
    paths:
      - "llama-bonsai/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Free disk space for CUDA build
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: llama-bonsai
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/llama-bonsai:latest
          # Deterministic: SOURCE_REF SHA pinned in the Dockerfile ARG default.
          # Do NOT override — bump the ARG to move along the fork's prism branch.
          cache-from: type=gha
          cache-to: type=gha,mode=max
