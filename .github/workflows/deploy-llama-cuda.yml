name: Build and push llama-cuda image

on:
  push:
    branches: [main]
    paths:
      - "llama-cuda/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Free disk space for CUDA build
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: llama-cuda
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/llama-cuda:latest
          # Deterministic build: SOURCE_REF is the commit SHA pinned as the ARG
          # default in the Dockerfile. Do NOT override — upstream ggerganov/llama.cpp
          # pinned for reproducibility. To bump the engine, edit the SHA in the Dockerfile.
          cache-from: type=gha
          cache-to: type=gha,mode=max
